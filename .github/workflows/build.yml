name: build
on:
  workflow_dispatch:
  push:
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: generate project
        run: |
          mkdir -p app/src/main/java/bot app/src/main/res/values app/src/main/res/xml
          cat > settings.gradle.kts <<'E1'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "bot"
          include(":app")
          E1
          cat > build.gradle.kts <<'E2'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          E2
          echo "android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle.kts <<'E3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "bot"
              compileSdk = 34
              defaultConfig {
                  applicationId = "bot.stairs"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          E3
          cat > app/src/main/AndroidManifest.xml <<'E4'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <application android:label="@string/app_name" android:theme="@android:style/Theme.DeviceDefault.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".CaptureService" android:exported="false"
                      android:foregroundServiceType="mediaProjection"/>
                  <service android:name=".TapService" android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/acc"/>
                  </service>
              </application>
          </manifest>
          E4
          cat > app/src/main/res/values/strings.xml <<'E5'
          <resources>
              <string name="app_name">계단봇</string>
              <string name="desc">게임 화면을 자동으로 터치합니다</string>
          </resources>
          E5
          cat > app/src/main/res/xml/acc.xml <<'E6'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:description="@string/desc" />
          E6
          cat > app/src/main/java/bot/Main.kt <<'E7'
          package bot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.app.*
          import android.content.*
          import android.content.pm.ServiceInfo
          import android.graphics.*
          import android.hardware.display.DisplayManager
          import android.media.ImageReader
          import android.media.projection.*
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.view.*
          import android.view.accessibility.AccessibilityEvent
          import android.widget.*
          import java.nio.ByteBuffer
          import kotlin.math.abs

          // ===== 조절용 설정값 =====
          const val BATCH = 3            // 한 번 인식할 때마다 누르는 횟수 (클수록 빠름)
          const val GAP = 40L            // 연속 터치 간격(ms) (작을수록 빠름)
          const val LAT = 90L            // 터치 후 화면 반영 대기(ms)
          const val TURN_CLIMBS = true   // 방향전환 버튼이 올라가기도 같이 하면 true
          const val MF = 0.6f            // 블록으로 인정하는 일치율 (높을수록 엄격)
          const val CLEAR = 0.25f        // 확실히 블록이 아니라고 보는 일치율

          // 발판 블록 기준 모양 (스크린샷에서 추출)
          const val REFHEX =
              "35835836936947b9cf9cf9cf47b9cf9cfacfacfacfacf37cacf9cf9cf" +
              "24624624624647bacf7ae7ae47b7ae7af7af7af8ae8ae37cacf8ad8ad" +
              "24624623623646aacf7af7af47b8af7af7af7af7af7af37cacf8ae8ae" +
              "24624623623646aacf7af7af47b8af7af7af7af7af8af37cacf8ae8ae" +
              "12312312312323537c37c37c37c37c37c37c37c37c37c37c37c37c37c" +
              "35735735735746aacfacfacfacfacfacf37cacfacfacfacfacf9cf9cf" +
              "24624624624646aacf8af8af8af7af7af37cacf8af8af8af8af7af7af" +
              "24624624624646aacf8af8af8af7af7af37cacf8af8af8af8af7af7af" +
              "12412412412524647b37c37c37c37c37c37c37b37c37c37c37c37c37c"
          val REF: IntArray = IntArray(513) { REFHEX[it].digitToInt(16) * 16 + 8 }

          class Fr(val ok: Boolean, val face: Int, val dirs: List<Int>, val t: Long, val stable: Int)

          class TapService : AccessibilityService() {
              companion object { @Volatile var inst: TapService? = null }
              override fun onServiceConnected() { inst = this }
              override fun onUnbind(i: Intent?): Boolean { inst = null; return super.onUnbind(i) }
              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              fun tap(x: Float, y: Float) {
                  val p = Path().apply { moveTo(x, y) }
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(p, 0, 15)).build()
                  dispatchGesture(g, null, null)
              }
          }

          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val l = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 80, 40, 40) }
                  fun btn(t: String, f: () -> Unit) {
                      l.addView(Button(this).apply { text = t; setOnClickListener { f() } })
                  }
                  l.addView(TextView(this).apply { text = "순서대로 1 → 2 → 3 누른 뒤 게임을 켜세요.\n게임 화면에서 왼쪽 위 반투명 버튼으로 시작/정지합니다.\n게임 맨 처음 칸에서만 틀리면 '첫칸' 버튼을 바꿔보세요." })
                  btn("1. 다른 앱 위에 표시 허용") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }
                  btn("2. 접근성 켜기 (계단봇 선택)") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  btn("3. 시작 (화면 캡처 허용)") {
                      val mpm = getSystemService(MediaProjectionManager::class.java)
                      startActivityForResult(mpm.createScreenCaptureIntent(), 1)
                  }
                  btn("종료") { stopService(Intent(this, CaptureService::class.java)) }
                  setContentView(l)
              }

              override fun onActivityResult(rq: Int, rc: Int, d: Intent?) {
                  super.onActivityResult(rq, rc, d)
                  if (rq == 1 && rc == RESULT_OK && d != null) {
                      startForegroundService(Intent(this, CaptureService::class.java).putExtra("rc", rc).putExtra("d", d))
                      moveTaskToBack(true)
                  }
              }
          }

          class CaptureService : Service() {
              @Volatile var run = false
              @Volatile var active = false
              @Volatile var firstTurn = false
              @Volatile var fr = Fr(false, 0, emptyList(), 0L, 0)
              var mp: MediaProjection? = null
              var reader: ImageReader? = null
              var ht: HandlerThread? = null
              var wm: WindowManager? = null
              var ov: View? = null
              var W = 0
              var H = 0

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("c", "bot", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "c").setContentTitle("계단봇 실행 중")
                      .setSmallIcon(android.R.drawable.ic_menu_view).build()
                  if (Build.VERSION.SDK_INT >= 29)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  else startForeground(1, n)
                  if (i == null || run) return START_NOT_STICKY
                  val rc = i.getIntExtra("rc", 0)
                  val d = i.getParcelableExtra<Intent>("d") ?: return START_NOT_STICKY
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val pt = Point()
                  wm!!.defaultDisplay.getRealSize(pt)
                  W = pt.x; H = pt.y
                  mp = getSystemService(MediaProjectionManager::class.java).getMediaProjection(rc, d)
                  mp!!.registerCallback(object : MediaProjection.Callback() {}, Handler(Looper.getMainLooper()))
                  reader = ImageReader.newInstance(W, H, PixelFormat.RGBA_8888, 3)
                  ht = HandlerThread("ir").also { it.start() }
                  reader!!.setOnImageAvailableListener({ r -> onFrame(r) }, Handler(ht!!.looper))
                  mp!!.createVirtualDisplay("c", W, H, resources.displayMetrics.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader!!.surface, null, null)
                  showOverlay()
                  run = true
                  Thread { loop() }.start()
                  return START_NOT_STICKY
              }

              fun showOverlay() {
                  val l = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; alpha = 0.5f; setBackgroundColor(Color.BLACK) }
                  val b1 = Button(this).apply { text = "▶ 시작"; textSize = 12f }
                  val b2 = Button(this).apply { text = "첫칸:오르기"; textSize = 12f }
                  b1.setOnClickListener { active = !active; b1.text = if (active) "■ 정지" else "▶ 시작" }
                  b2.setOnClickListener { firstTurn = !firstTurn; b2.text = if (firstTurn) "첫칸:전환" else "첫칸:오르기" }
                  l.addView(b1); l.addView(b2)
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START }
                  wm!!.addView(l, lp)
                  ov = l
              }

              // 새 프레임이 올 때마다 화면을 분석해 둔다
              fun onFrame(r: ImageReader) {
                  val img = (try { r.acquireLatestImage() } catch (e: Exception) { null }) ?: return
                  try {
                      val pl = img.planes[0]
                      val a = analyze(pl.buffer, pl.rowStride, pl.pixelStride)
                      val o = fr
                      val now = SystemClock.uptimeMillis()
                      fr = if (a == null) Fr(false, 0, emptyList(), now, 0)
                      else Fr(true, a.first, a.second, now,
                          if (o.ok && o.face == a.first && o.dirs == a.second) o.stable + 1 else 0)
                  } catch (e: Exception) {
                  } finally {
                      img.close()
                  }
              }

              // 반환: (현재 바라보는 방향 +1/-1/0=모름, 앞으로 올라갈 방향 목록). 인식 불가면 null
              fun analyze(buf: ByteBuffer, rs: Int, ps: Int): Pair<Int, List<Int>>? {
                  val fx = W / 1080f
                  val fy = H / 2340f
                  // (cx,cy) 위치가 발판 블록과 얼마나 닮았는지 0~1, 화면 밖이면 -1
                  fun score(cx: Int, cy: Int): Float {
                      var n = 0
                      var m = 0
                      var i = 0
                      var dy = -32
                      while (dy <= 32) {
                          var dx = -72
                          while (dx <= 72) {
                              val x = ((cx + dx) * fx).toInt()
                              val y = ((cy + dy) * fy).toInt()
                              if (x in 0 until W && y in 0 until H) {
                                  val o = y * rs + x * ps
                                  val r = buf.get(o).toInt() and 255
                                  val g = buf.get(o + 1).toInt() and 255
                                  val b = buf.get(o + 2).toInt() and 255
                                  val q = i * 3
                                  if (abs(r - REF[q]) + abs(g - REF[q + 1]) + abs(b - REF[q + 2]) < 60) m++
                                  n++
                              }
                              i++
                              dx += 8
                          }
                          dy += 8
                      }
                      return if (n < 77) -1f else m.toFloat() / n
                  }
                  // 지금 서 있는 발판이 제자리에 있어야 정상 화면 (스크롤 중이면 제외)
                  if (score(540, 1498) < 0.75f) return null
                  // 바로 아래 발판이 어느 쪽이었는지 보면 지금 바라보는 방향을 알 수 있음
                  val sa = score(375, 1588)
                  val sb = score(705, 1588)
                  val face = if (sa >= MF && sb < MF) 1 else if (sb >= MF && sa < MF) -1 else 0
                  val dirs = ArrayList<Int>()
                  var col = 0
                  for (k in 1..8) {
                      val cy = 1498 - 90 * k
                      val a = score(540 + 165 * (col - 1), cy)
                      val b = score(540 + 165 * (col + 1), cy)
                      val ma = a >= MF
                      val mb = b >= MF
                      val d = when {
                          ma && mb -> 0
                          ma -> -1
                          mb -> 1
                          a < 0f && b >= 0f && b <= CLEAR -> -1
                          b < 0f && a >= 0f && a <= CLEAR -> 1
                          k <= 6 && col - 1 == 0 && b >= 0f && b <= CLEAR -> -1
                          k <= 6 && col + 1 == 0 && a >= 0f && a <= CLEAR -> 1
                          else -> 0
                      }
                      if (d == 0) break
                      dirs.add(d)
                      col += d
                  }
                  return if (dirs.isEmpty()) null else Pair(face, dirs)
              }

              fun loop() {
                  var was = false
                  var tapTime = 0L
                  var badSince = 0L
                  var last = 0
                  var exp: List<Int>? = null
                  var expFace = 0
                  val fx = W / 1080f
                  val fy = H / 2340f
                  while (run) {
                      try {
                          if (!active) { was = false; Thread.sleep(80); continue }
                          if (!was) { was = true; tapTime = 0L; badSince = 0L; last = 0; exp = null }
                          val now = SystemClock.uptimeMillis()
                          val f = fr
                          if (!f.ok) {
                              if (badSince == 0L) badSince = now
                              if (now - badSince > 800) { last = 0; exp = null }
                              Thread.sleep(3)
                              continue
                          }
                          badSince = 0L
                          // 직전에 예상한 계단 모양과 맞으면 바로 진행, 아니면 화면이 안정될 때까지 대기
                          val e = exp
                          val m = if (e == null) 0 else minOf(e.size, f.dirs.size)
                          val consistent = e != null && m > 0 && f.dirs.take(m) == e.take(m) &&
                              (f.face == 0 || f.face == expFace)
                          val fresh = f.t > tapTime + LAT || now - tapTime > 350
                          val settled = consistent || f.stable >= 2 || now - f.t > 60
                          if (!fresh || !settled) { Thread.sleep(3); continue }
                          val ts = TapService.inst
                          var face = if (f.face != 0) f.face else last
                          val n = minOf(f.dirs.size, BATCH)
                          for (i in 0 until n) {
                              val d = f.dirs[i]
                              val turn = if (face == 0) firstTurn else d != face
                              if (turn) {
                                  ts?.tap(185f * fx, 1950f * fy)
                                  if (!TURN_CLIMBS) { Thread.sleep(GAP); ts?.tap(895f * fx, 1950f * fy) }
                              } else {
                                  ts?.tap(895f * fx, 1950f * fy)
                              }
                              face = d
                              Thread.sleep(GAP)
                          }
                          last = face
                          exp = f.dirs.drop(n)
                          expFace = face
                          tapTime = SystemClock.uptimeMillis()
                      } catch (e: Exception) {
                          Thread.sleep(30)
                      }
                  }
              }

              override fun onDestroy() {
                  run = false
                  try { wm?.removeView(ov) } catch (e: Exception) {}
                  try { mp?.stop() } catch (e: Exception) {}
                  try { reader?.close() } catch (e: Exception) {}
                  try { ht?.quitSafely() } catch (e: Exception) {}
                  super.onDestroy()
              }
          }
          E7
      - name: build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk
