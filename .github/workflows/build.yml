name: build
on:
  workflow_dispatch:
  push:

jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: generate project
        run: |
          mkdir -p app/src/main/java/bot app/src/main/res/values app/src/main/res/xml

          cat > settings.gradle.kts <<'E1'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "bot"
          include(":app")
          E1

          cat > build.gradle.kts <<'E2'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          E2

          echo "android.useAndroidX=true" > gradle.properties

          cat > app/build.gradle.kts <<'E3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "bot"
              compileSdk = 34
              defaultConfig {
                  applicationId = "bot.stairs"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          E3

          cat > app/src/main/AndroidManifest.xml <<'E4'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <application android:label="@string/app_name" android:theme="@android:style/Theme.DeviceDefault.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".CaptureService" android:exported="false"
                      android:foregroundServiceType="mediaProjection"/>
                  <service android:name=".TapService" android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/acc"/>
                  </service>
              </application>
          </manifest>
          E4

          cat > app/src/main/res/values/strings.xml <<'E5'
          <resources>
              <string name="app_name">계단봇</string>
              <string name="desc">게임 화면을 자동으로 터치합니다</string>
          </resources>
          E5

          cat > app/src/main/res/xml/acc.xml <<'E6'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:description="@string/desc" />
          E6

          cat > app/src/main/java/bot/Main.kt <<'E7'
          package bot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.app.*
          import android.content.*
          import android.content.pm.ServiceInfo
          import android.graphics.*
          import android.hardware.display.DisplayManager
          import android.media.ImageReader
          import android.media.projection.*
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.view.*
          import android.view.accessibility.AccessibilityEvent
          import android.widget.*
          import java.nio.ByteBuffer
          import kotlin.math.abs

          // ===== 설정 =====

          const val GAP = 70L
          const val LS = 90L
          const val TURN_CLIMBS = true

          // 기존 인식 기준으로 복구
          const val MF = 0.50f
          const val SOFT = 0.27f
          const val MARGIN = 0.15f

          // 경로 관리
          const val MAX_QUEUE = 24
          const val REFILL_AT = 6

          // 템플릿
          const val H1 =
              "35835836936947b9cf9cf9cf47b9cf9cfacfacfacfacf37cacf9cf9cf" +
              "24624624624647bacf7ae7ae47b7ae7af7af7af8ae8ae37cacf8ad8ad" +
              "24624623623646aacf7af7af47b8af7af7af7af7af7af37cacf8ae8ae" +
              "24624623623646aacf7af7af47b8af7af7af7af7af8af37cacf8ae8ae" +
              "12312312312323537c37c37c37c37c37c37c37c37c37c37c37c37c37c" +
              "35735735735746aacfacfacfacfacfacf37cacfacfacfacfacf9cf9cf" +
              "24624624624646aacf8af8af8af7af7af37cacf8af8af8af8af7af7af" +
              "24624624624646aacf8af8af8af7af7af37cacf8af8af8af8af7af7af" +
              "12412412412524647b37c37c37c37c37c37c37b37c37c37c37c37c37c"

          const val H2 =
              "e93e93ec4ff5ff5ff5ff5ff5ff5ff5ff5ff5ff5ff5ff5ff5ff5ff5" +
              "b62b62e93ec4ed4fd4fd4fd4fd4fd4fd4ed4ed4ed4ed4ed4ed4ed4" +
              "b62b62e93ec4b62b62b62fd5b62b62fd5b62ed4ed4ed4b62b62ed4ed4" +
              "b62b62e93ed4e93e93da3fd5e93e93fd4e93ed4ed4ed4e93e93c62ed4" +
              "b62b62e93ed4e93ed4ed4fd5eb3da2fd4e93ed4ed4ed4e93ed4e93ed4" +
              "b62b62e93ed4e93ed4b61fd5eb3da2fd4e93ed4ed4ed4e93ed4e93ed4" +
              "b62b62e93ed4e93fd5da3fd5eb4da3fd4e93fd5fd5ed4e93fd5e93ed4" +
              "b62b62e93ed4e93c72da3fd4d93e93fd4e93c72c72ed4e93c72da3ed4" +
              "b62b62e93ed4fd4fd4fd4ed4fd4fd4ed4fd4fd4fd4ed4fd4fd4ed4ed4"

          const val H3 =
              "d47d47d68facfacfacfacfacfacfacfadfadfadfacfacfdefacfdffdf" +
              "924924d47e7ae7ae7ae69e79e7be8be8ae8ae69e69e79e79e79e69fac" +
              "924924d47e7be7b924924924924924924e8b924e79e79e79924e69fac" +
              "924924d47e7bf7bd47d47d47d47e47e47e8ae47924e79924d47e69fac" +
              "924924d47e79e7bd47f7be69d47e69e8be8bd47d47924d47d47e79fac" +
              "924924d47e79e79d47f7ba25d47d47d47f8bd47e7bd47e7bd47e79fac" +
              "924924d47e79e79d47f7ad47d47f79e79e69d47e7be7be7bd47e79fac" +
              "934934d47e69e69d47d47d47d47d47d47e69d47e79e7be7bd47f9be9b" +
              "934934d47e6ae6ae69e69e69f7af7bf7be79f69e79e79e7bf7bf9bf9b"

          fun dec(h: String): IntArray {
              return IntArray(513) {
                  val c = h.getOrNull(it) ?: '8'
                  c.digitToInt(16) * 16 + 8
              }
          }

          val TPL: Array<IntArray> = arrayOf(
              dec(H1),
              dec(H2),
              dec(H3)
          )

          class Fr(
              val ok: Boolean,
              val face: Int,
              val dirs: List<Int>,
              val t: Long,
              val stable: Int
          )

          class TapService : AccessibilityService() {

              companion object {
                  @Volatile var inst: TapService? = null
              }

              override fun onServiceConnected() {
                  inst = this
              }

              override fun onUnbind(i: Intent?): Boolean {
                  inst = null
                  return super.onUnbind(i)
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              fun tap(x: Float, y: Float) {
                  val p = Path().apply {
                      moveTo(x, y)
                  }

                  val g = GestureDescription.Builder()
                      .addStroke(
                          GestureDescription.StrokeDescription(p, 0, 15)
                      ).build()

                  dispatchGesture(g, null, null)
              }
          }

          class MainActivity : Activity() {

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)

                  val l = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 80, 40, 40)
                  }

                  fun btn(t: String, f: () -> Unit) {
                      l.addView(Button(this).apply {
                          text = t
                          setOnClickListener {
                              f()
                          }
                      })
                  }

                  l.addView(TextView(this).apply {
                      text = "순서대로 1 → 2 → 3 누른 뒤 게임을 켜세요.\n게임 화면 왼쪽 위 반투명 버튼으로 시작/정지합니다.\n게임 맨 처음 칸에서만 틀리면 '첫칸' 버튼을 바꿔보세요."
                  })

                  btn("1. 다른 앱 위에 표시 허용") {
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                      )
                  }

                  btn("2. 접근성 켜기 (계단봇 선택)") {
                      startActivity(
                          Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                      )
                  }

                  btn("3. 시작 (화면 캡처 허용)") {
                      val mpm =
                          getSystemService(MediaProjectionManager::class.java)

                      startActivityForResult(
                          mpm.createScreenCaptureIntent(), 1
                      )
                  }

                  btn("종료") {
                      stopService(
                          Intent(this, CaptureService::class.java)
                      )
                  }

                  setContentView(l)
              }

              override fun onActivityResult(
                  rq: Int,
                  rc: Int,
                  d: Intent?
              ) {
                  super.onActivityResult(rq, rc, d)

                  if (rq == 1 && rc == RESULT_OK && d != null) {
                      startForegroundService(
                          Intent(this, CaptureService::class.java)
                              .putExtra("rc", rc)
                              .putExtra("d", d)
                      )

                      moveTaskToBack(true)
                  }
              }
          }

          class CaptureService : Service() {

              @Volatile var run = false
              @Volatile var active = false
              @Volatile var firstTurn = false

              @Volatile var fr = Fr(
                  false, 0, emptyList(), 0L, 0
              )

              @Volatile var tv: TextView? = null

              val ui = Handler(Looper.getMainLooper())

              var mp: MediaProjection? = null
              var reader: ImageReader? = null
              var ht: HandlerThread? = null
              var wm: WindowManager? = null
              var ov: View? = null

              var W = 0
              var H = 0
              var lastAnalysisTime = 0L

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(
                  i: Intent?,
                  f: Int,
                  id: Int
              ): Int {

                  val nm =
                      getSystemService(NotificationManager::class.java)

                  nm.createNotificationChannel(
                      NotificationChannel(
                          "c",
                          "bot",
                          NotificationManager.IMPORTANCE_LOW
                      )
                  )

                  val n = Notification.Builder(this, "c")
                      .setContentTitle("계단봇 실행 중")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .build()

                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(
                          1,
                          n,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
                      )
                  } else {
                      startForeground(1, n)
                  }

                  if (i == null || run) {
                      return START_NOT_STICKY
                  }

                  val rc = i.getIntExtra("rc", 0)

                  val d = i.getParcelableExtra<Intent>("d")
                      ?: return START_NOT_STICKY

                  wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  val pt = Point()
                  wm!!.defaultDisplay.getRealSize(pt)

                  W = pt.x
                  H = pt.y

                  mp = getSystemService(
                      MediaProjectionManager::class.java
                  ).getMediaProjection(rc, d)

                  mp!!.registerCallback(
                      object : MediaProjection.Callback() {},
                      Handler(Looper.getMainLooper())
                  )

                  reader = ImageReader.newInstance(
                      W,
                      H,
                      PixelFormat.RGBA_8888,
                      3
                  )

                  ht = HandlerThread("ir").also {
                      it.start()
                  }

                  reader!!.setOnImageAvailableListener(
                      { r -> onFrame(r) },
                      Handler(ht!!.looper)
                  )

                  mp!!.createVirtualDisplay(
                      "c",
                      W,
                      H,
                      resources.displayMetrics.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      reader!!.surface,
                      null,
                      null
                  )

                  showOverlay()

                  run = true

                  Thread {
                      loop()
                  }.start()

                  return START_NOT_STICKY
              }

              fun showOverlay() {

                  val l = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      alpha = 0.5f
                      setBackgroundColor(Color.BLACK)
                  }

                  val b1 = Button(this).apply {
                      text = "▶ 시작"
                      textSize = 12f
                  }

                  val b2 = Button(this).apply {
                      text = "첫칸:오르기"
                      textSize = 12f
                  }

                  val t = TextView(this).apply {
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      setPadding(12, 0, 12, 0)
                      text = "대기"
                  }

                  b1.setOnClickListener {
                      active = !active
                      b1.text =
                          if (active) "■ 정지" else "▶ 시작"
                  }

                  b2.setOnClickListener {
                      firstTurn = !firstTurn
                      b2.text =
                          if (firstTurn) "첫칸:전환" else "첫칸:오르기"
                  }

                  l.addView(b1)
                  l.addView(b2)
                  l.addView(t)

                  tv = t

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                  }

                  wm!!.addView(l, lp)
                  ov = l
              }

              // 화면 프레임 분석
              fun onFrame(r: ImageReader) {

                  val img = try {
                      r.acquireLatestImage()
                  } catch (e: Exception) {
                      null
                  } ?: return

                  try {

                      // 분석 빈도를 약 40FPS로 제한해 부하 감소
                      val now = SystemClock.uptimeMillis()

                      if (now - lastAnalysisTime < 25L) {
                          return
                      }

                      lastAnalysisTime = now

                      val pl = img.planes[0]

                      val a = analyze(
                          pl.buffer,
                          pl.rowStride,
                          pl.pixelStride
                      )

                      val o = fr
                      val stamp = SystemClock.uptimeMillis()

                      if (a == null) {

                          fr = Fr(
                              false,
                              0,
                              emptyList(),
                              stamp,
                              0
                          )

                      } else {

                          // 전체 경로가 아니라 앞의 두 방향을 기준으로
                          // 프레임 안정도를 계산
                          val same =
                              o.ok &&
                              o.face == a.first &&
                              o.dirs.isNotEmpty() &&
                              a.second.isNotEmpty() &&
                              o.dirs.take(2) == a.second.take(2)

                          fr = Fr(
                              true,
                              a.first,
                              a.second,
                              stamp,
                              if (same) o.stable + 1 else 1
                          )
                      }

                  } catch (e: Exception) {
                  } finally {
                      img.close()
                  }
              }

              // 발판 인식
              fun analyze(
                  buf: ByteBuffer,
                  rs: Int,
                  ps: Int
              ): Pair<Int, List<Int>>? {

                  val fx = W / 1080f
                  val fy = H / 2340f

                  val t0 = TPL[0]
                  val t1 = TPL[1]
                  val t2 = TPL[2]

                  fun score(cx: Int, cy: Int): Float {

                      var n = 0
                      val matches = IntArray(3)

                      var i = 0
                      var dy = -32

                      while (dy <= 32) {

                          var dx = -72

                          while (dx <= 72) {

                              val x = ((cx + dx) * fx).toInt()
                              val y = ((cy + dy) * fy).toInt()

                              // 템플릿 위치는 화면 밖이어도 증가시킴
                              val q = i * 3

                              if (x in 0 until W && y in 0 until H) {

                                  val o = y * rs + x * ps

                                  val r = buf.get(o).toInt() and 255
                                  val g = buf.get(o + 1).toInt() and 255
                                  val b = buf.get(o + 2).toInt() and 255

                                  val d0 =
                                      abs(r - t0[q]) +
                                      abs(g - t0[q + 1]) +
                                      abs(b - t0[q + 2])

                                  val d1 =
                                      abs(r - t1[q]) +
                                      abs(g - t1[q + 1]) +
                                      abs(b - t1[q + 2])

                                  val d2 =
                                      abs(r - t2[q]) +
                                      abs(g - t2[q + 1]) +
                                      abs(b - t2[q + 2])

                                  if (d0 < 65) matches[0]++
                                  if (d1 < 65) matches[1]++
                                  if (d2 < 65) matches[2]++

                                  n++
                              }

                              i++
                              dx += 8
                          }

                          dy += 8
                      }

                      if (n < 150) return -1f

                      val best = maxOf(
                          matches[0],
                          matches[1],
                          matches[2]
                      )

                      return best.toFloat() / n
                  }

                  // 위치 보정
                  var ox = 0
                  var oy = 0

                  val s1 = maxOf(
                      score(375, 1408),
                      score(705, 1408)
                  )

                  if (s1 < MF) {

                      var best = s1
                      var bestX = 0
                      var bestY = 0

                      // 넓은 범위를 성긴 간격으로 탐색
                      for (by in -24..24 step 12) {

                          for (bx in -36..36 step 12) {

                              val v = maxOf(
                                  score(375 + bx, 1408 + by),
                                  score(705 + bx, 1408 + by)
                              )

                              if (v > best) {
                                  best = v
                                  bestX = bx
                                  bestY = by
                              }
                          }
                      }

                      // 가장 좋은 위치 주변만 세밀하게 재검사
                      if (best >= MF) {

                          var fineBest = best
                          var fineX = bestX
                          var fineY = bestY

                          for (by in (bestY - 6)..(bestY + 6) step 6) {

                              for (bx in (bestX - 6)..(bestX + 6) step 6) {

                                  val v = maxOf(
                                      score(375 + bx, 1408 + by),
                                      score(705 + bx, 1408 + by)
                                  )

                                  if (v > fineBest) {
                                      fineBest = v
                                      fineX = bx
                                      fineY = by
                                  }
                              }
                          }

                          ox = fineX
                          oy = fineY
                      }
                  }

                  // 현재 방향
                  val sa = score(
                      375 + ox,
                      1588 + oy
                  )

                  val sb = score(
                      705 + ox,
                      1588 + oy
                  )

                  val face = when {
                      sa >= MF && sb < SOFT -> 1
                      sb >= MF && sa < SOFT -> -1
                      else -> 0
                  }

                  // 다음 계단 방향을 최대 10개까지 탐색
                  val dirs = ArrayList<Int>()

                  var col = 0

                  for (k in 1..10) {

                      val cy = 1498 - 90 * k + oy

                      val a = score(
                          540 + 165 * (col - 1) + ox,
                          cy
                      )

                      val b = score(
                          540 + 165 * (col + 1) + ox,
                          cy
                      )

                      val aa = maxOf(a, 0f)
                      val bb = maxOf(b, 0f)

                      val d = when {

                          aa >= SOFT && bb < SOFT -> -1
                          bb >= SOFT && aa < SOFT -> 1

                          aa >= SOFT &&
                          bb >= SOFT &&
                          aa - bb >= MARGIN -> -1

                          bb >= SOFT &&
                          aa >= SOFT &&
                          bb - aa >= MARGIN -> 1

                          else -> 0
                      }

                      if (d == 0) break

                      dirs.add(d)
                      col += d
                  }

                  return if (dirs.isEmpty()) {
                      null
                  } else {
                      Pair(face, dirs)
                  }
              }

              // 경로 연결 및 터치 실행
              fun loop() {

                  val fx = W / 1080f
                  val fy = H / 2340f

                  // P: 앞으로 실행할 경로
                  // issued: 이미 실행한 경로의 개수
                  val P = ArrayList<Int>()
                  val tapT = ArrayList<Long>()

                  var issued = 0
                  var face = 0
                  var usedT = 0L
                  var lastTap = 0L
                  var badSince = 0L
                  var lastUi = 0L
                  var was = false

                  // 새 경로 후보를 여러 프레임에서 비교
                  var candidateTail: List<Int>? = null
                  var candidateHits = 0
                  var candidateAt = 0L

                  fun idxAt(t: Long): Int {

                      var c = issued

                      while (
                          c > 0 &&
                          tapT[c - 1] > t
                      ) {
                          c--
                      }

                      return c
                  }

                  // 두 경로가 처음으로 달라지는 지점 전까지 반환
                  fun commonPrefix(
                      a: List<Int>,
                      b: List<Int>
                  ): List<Int> {

                      val out = ArrayList<Int>()
                      val n = minOf(a.size, b.size)

                      for (i in 0 until n) {
                          if (a[i] != b[i]) break
                          out.add(a[i])
                      }

                      return out
                  }

                  // 경로 버퍼가 넘치지 않도록 추가
                  fun addSteps(steps: List<Int>) {

                      val remaining = P.size - issued
                      val room = MAX_QUEUE - remaining

                      val count = minOf(
                          room.coerceAtLeast(0),
                          steps.size
                      )

                      for (i in 0 until count) {
                          P.add(steps[i])
                      }
                  }

                  while (run) {

                      try {

                          if (!active) {
                              was = false
                              Thread.sleep(80)
                              continue
                          }

                          val now = SystemClock.uptimeMillis()

                          if (!was) {

                              was = true

                              P.clear()
                              tapT.clear()

                              issued = 0
                              face = 0
                              usedT = 0L
                              lastTap = 0L
                              badSince = 0L

                              candidateTail = null
                              candidateHits = 0
                              candidateAt = 0L
                          }

                          val f = fr
                          val rest0 = P.size - issued

                          // 상태 표시
                          if (now - lastUi > 300) {

                              lastUi = now

                              val st =
                                  (if (f.ok) "인식O" else "인식X") +
                                  " 안정도" + f.stable +
                                  " 경로" + rest0

                              ui.post {
                                  tv?.text = st
                              }
                          }

                          if (!f.ok) {

                              if (badSince == 0L) {
                                  badSince = now
                              }

                              // 경로가 없고 장시간 인식 실패한 경우만 초기화
                              if (
                                  rest0 == 0 &&
                                  now - badSince > 1000
                              ) {

                                  P.clear()
                                  tapT.clear()

                                  issued = 0
                                  face = 0

                                  candidateTail = null
                                  candidateHits = 0
                              }

                          } else {

                              badSince = 0L

                              if (f.t != usedT) {

                                  if (rest0 == 0) {

                                      // 새 경로 시작
                                      // 앞의 두 방향이 연속 프레임에서
                                      // 확인된 경우에만 경로 확보
                                      if (
                                          f.stable >= 2 &&
                                          f.dirs.isNotEmpty() &&
                                          f.t >= lastTap + 15L
                                      ) {

                                          addSteps(f.dirs)

                                          if (f.face != 0) {
                                              face = f.face
                                          }

                                          candidateTail = null
                                          candidateHits = 0
                                          candidateAt = 0L
                                      }

                                  } else if (rest0 <= REFILL_AT) {

                                      // 남은 경로가 6개 이하일 때
                                      // 다음 경로를 미리 연결
                                      val ap = idxAt(f.t - LS)

                                      var rawTail: List<Int>? = null

                                      for (
                                          sh in intArrayOf(
                                              0, -1, 1,
                                              -2, 2, -3, 3
                                          )
                                      ) {

                                          val a = ap + sh
                                          val off = issued - a

                                          if (
                                              a < 0 ||
                                              a > issued ||
                                              off < 0 ||
                                              off >= f.dirs.size
                                          ) {
                                              continue
                                          }

                                          // 현재 남은 경로 전체와
                                          // 새 화면의 경로가 일치해야 함
                                          val available =
                                              f.dirs.size - off

                                          if (available < rest0) {
                                              continue
                                          }

                                          val current =
                                              P.subList(
                                                  issued,
                                                  P.size
                                              )

                                          val observed =
                                              f.dirs.subList(
                                                  off,
                                                  off + rest0
                                              )

                                          if (current != observed) {
                                              continue
                                          }

                                          val tl =
                                              f.dirs.subList(
                                                  off + rest0,
                                                  f.dirs.size
                                              ).toList()

                                          if (tl.isEmpty()) {
                                              continue
                                          }

                                          rawTail =
                                              if (rawTail == null) {
                                                  tl
                                              } else {
                                                  commonPrefix(rawTail, tl)
                                              }
                                      }

                                      // 새 경로가 연속 프레임에서
                                      // 일치할 때만 실제 버퍼에 추가
                                      if (
                                          rawTail != null &&
                                          rawTail.isNotEmpty()
                                      ) {

                                          val previous = candidateTail

                                          if (
                                              previous == null ||
                                              now - candidateAt > 100L
                                          ) {

                                              candidateTail = rawTail
                                              candidateHits = 1

                                          } else {

                                              val common =
                                                  commonPrefix(
                                                      previous,
                                                      rawTail
                                                  )

                                              if (common.isNotEmpty()) {

                                                  candidateTail = common
                                                  candidateHits++

                                              } else {

                                                  candidateTail = rawTail
                                                  candidateHits = 1
                                              }
                                          }

                                          candidateAt = now

                                          if (candidateHits >= 2) {

                                              val confirmed =
                                                  candidateTail

                                              if (
                                                  confirmed != null &&
                                                  confirmed.isNotEmpty()
                                              ) {
                                                  addSteps(confirmed)
                                              }

                                              candidateTail = null
                                              candidateHits = 0
                                              candidateAt = 0L
                                          }

                                      } else if (
                                          candidateAt != 0L &&
                                          now - candidateAt > 100L
                                      ) {

                                          candidateTail = null
                                          candidateHits = 0
                                          candidateAt = 0L
                                      }

                                  } else {

                                      // 경로가 충분히 남아 있으면
                                      // 새 경로 후보를 초기화
                                      candidateTail = null
                                      candidateHits = 0
                                      candidateAt = 0L
                                  }

                                  usedT = f.t
                              }
                          }

                          // 터치 실행
                          if (issued < P.size) {

                              val ts = TapService.inst

                              if (ts == null) {
                                  Thread.sleep(20)
                                  continue
                              }

                              val d = P[issued]

                              val turn =
                                  if (face == 0) {
                                      firstTurn
                                  } else {
                                      d != face
                                  }

                              if (turn) {

                                  ts.tap(
                                      185f * fx,
                                      1950f * fy
                                  )

                                  if (!TURN_CLIMBS) {

                                      Thread.sleep(GAP)

                                      ts.tap(
                                          895f * fx,
                                          1950f * fy
                                      )
                                  }

                              } else {

                                  ts.tap(
                                      895f * fx,
                                      1950f * fy
                                  )
                              }

                              face = d
                              issued++

                              lastTap = SystemClock.uptimeMillis()
                              tapT.add(lastTap)

                              // 오래된 실행 기록을 정리
                              if (issued >= 120) {

                                  P.subList(0, issued).clear()
                                  tapT.subList(0, issued).clear()

                                  issued = 0

                                  candidateTail = null
                                  candidateHits = 0
                                  candidateAt = 0L
                              }

                              Thread.sleep(GAP)

                          } else {

                              Thread.sleep(3)
                          }

                      } catch (e: Exception) {

                          Thread.sleep(20)
                      }
                  }
              }

              override fun onDestroy() {

                  run = false

                  try {
                      wm?.removeView(ov)
                  } catch (e: Exception) {}

                  try {
                      mp?.stop()
                  } catch (e: Exception) {}

                  try {
                      reader?.close()
                  } catch (e: Exception) {}

                  try {
                      ht?.quitSafely()
                  } catch (e: Exception) {}

                  super.onDestroy()
              }
          }
          E7

      - name: build
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk
