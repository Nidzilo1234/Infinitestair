
name: build
on:
  workflow_dispatch:
  push:
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: generate project
        run: |
          mkdir -p app/src/main/java/bot app/src/main/res/values app/src/main/res/xml

          cat > settings.gradle.kts <<'E1'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "bot"
          include(":app")
          E1

          cat > build.gradle.kts <<'E2'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          E2

          echo "android.useAndroidX=true" > gradle.properties

          cat > app/build.gradle.kts <<'E3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "bot"
              compileSdk = 34
              defaultConfig {
                  applicationId = "bot.stairs"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          E3

          cat > app/src/main/AndroidManifest.xml <<'E4'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <application android:label="@string/app_name" android:theme="@android:style/Theme.DeviceDefault.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".CaptureService" android:exported="false"
                      android:foregroundServiceType="mediaProjection"/>
                  <service android:name=".TapService" android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/acc"/>
                  </service>
              </application>
          </manifest>
          E4

          cat > app/src/main/res/values/strings.xml <<'E5'
          <resources>
              <string name="app_name">계단봇</string>
              <string name="desc">게임 화면을 자동으로 터치합니다</string>
          </resources>
          E5

          cat > app/src/main/res/xml/acc.xml <<'E6'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:description="@string/desc" />
          E6

          cat > app/src/main/java/bot/Main.kt <<'E7'
          package bot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.app.*
          import android.content.*
          import android.content.pm.ServiceInfo
          import android.graphics.*
          import android.hardware.display.DisplayManager
          import android.media.ImageReader
          import android.media.projection.*
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.view.*
          import android.view.accessibility.AccessibilityEvent
          import android.widget.*
          import java.nio.ByteBuffer
          import kotlin.math.abs

          // ===== 조절용 설정값 =====
          const val GAP = 70L
          const val LAT = 150L
          const val LS = 90L
          const val TURN_CLIMBS = true

          // 발판 인식 기준
          const val MF = 0.48f
          const val SOFT = 0.30f
          const val MARGIN = 0.14f
          const val CLEAR = 0.20f

          // 발판 모양 기준 데이터
          const val H1 =
              "35835836936947b9cf9cf9cf47b9cf9cfacfacfacfacf37cacf9cf9cf" +
              "24624624624647bacf7ae7ae47b7ae7af7af7af8ae8ae37cacf8ad8ad" +
              "24624623623646aacf7af7af47b8af7af7af7af7af7af37cacf8ae8ae" +
              "24624623623646aacf7af7af47b8af7af7af7af7af8af37cacf8ae8ae" +
              "12312312312323537c37c37c37c37c37c37c37c37c37c37c37c37c37c" +
              "35735735735746aacfacfacfacfacfacf37cacfacfacfacfacf9cf9cf" +
              "24624624624646aacf8af8af8af7af7af37cacf8af8af8af8af7af7af" +
              "24624624624646aacf8af8af8af7af7af37cacf8af8af8af8af7af7af" +
              "12412412412524647b37c37c37c37c37c37c37b37c37c37c37c37c37c"

          const val H2 =
              "e93e93ec4ff5ff5ff5ff5ff5ff5ff5ff5ff5ff5ff5ff5ff5ff5ff5ff5" +
              "b62b62e93ec4ed4fd4fd4fd4fd4fd4fd4ed4ed4ed4ed4ed4ed4ed4ed4" +
              "b62b62e93ec4b62b62b62fd5b62b62fd5b62ed4ed4ed4b62b62ed4ed4" +
              "b62b62e93ed4e93e93da3fd5e93e93fd4e93ed4ed4ed4e93e93c62ed4" +
              "b62b62e93ed4e93ed4ed4fd5eb3da2fd4e93ed4ed4ed4e93ed4e93ed4" +
              "b62b62e93ed4e93ed4b61fd5eb3da2fd4e93ed4ed4ed4e93ed4e93ed4" +
              "b62b62e93ed4e93fd5da3fd5eb4da3fd4e93fd5fd5ed4e93fd5e93ed4" +
              "b62b62e93ed4e93c72da3fd4d93e93fd4e93c72c72ed4e93c72da3ed4" +
              "b62b62e93ed4fd4fd4fd4ed4fd4fd4ed4fd4fd4fd4ed4fd4fd4ed4ed4"

          const val H3 =
              "d47d47d68facfacfacfacfacfacfacfadfadfadfacfacfdefacfdffdf" +
              "924924d47e7ae7ae7ae69e79e7be8be8ae8ae69e69e79e79e79e69fac" +
              "924924d47e7be7b924924924924924924e8b924e79e79e79924e69fac" +
              "924924d47e7bf7bd47d47d47d47e47e47e8ae47924e79924d47e69fac" +
              "924924d47e79e7bd47f7be69d47e69e8be8bd47d47924d47d47e79fac" +
              "924924d47e79e79d47f7ba25d47d47d47f8bd47e7bd47e7bd47e79fac" +
              "924924d47e79e79d47f7ad47d47f79e79e69d47e7be7be7bd47e79fac" +
              "934934d47e69e69d47d47d47d47d47d47e69d47e79e7be7bd47f9be9b" +
              "934934d47e6ae6ae69e69e69f7af7bf7be79f69e79e79e7bf7bf9bf9b"

          fun dec(h: String): IntArray =
              IntArray(513) { h[it].digitToInt(16) * 16 + 8 }

          val TPL: Array<IntArray> = arrayOf(dec(H1), dec(H2), dec(H3))

          class Fr(
              val ok: Boolean,
              val face: Int,
              val dirs: List<Int>,
              val t: Long,
              val stable: Int
          )

          class TapService : AccessibilityService() {
              companion object {
                  @Volatile var inst: TapService? = null
              }

              override fun onServiceConnected() {
                  inst = this
              }

              override fun onUnbind(i: Intent?): Boolean {
                  inst = null
                  return super.onUnbind(i)
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun tap(x: Float, y: Float) {
                  val p = Path().apply { moveTo(x, y) }
                  val g = GestureDescription.Builder()
                      .addStroke(
                          GestureDescription.StrokeDescription(p, 0, 15)
                      ).build()
                  dispatchGesture(g, null, null)
              }
          }

          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)

                  val l = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 80, 40, 40)
                  }

                  fun btn(t: String, f: () -> Unit) {
                      l.addView(Button(this).apply {
                          text = t
                          setOnClickListener { f() }
                      })
                  }

                  l.addView(TextView(this).apply {
                      text = "순서대로 1 → 2 → 3 누른 뒤 게임을 켜세요.\n게임 화면 왼쪽 위 반투명 버튼으로 시작/정지합니다.\n게임 맨 처음 칸에서만 틀리면 '첫칸' 버튼을 바꿔보세요."
                  })

                  btn("1. 다른 앱 위에 표시 허용") {
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                      )
                  }

                  btn("2. 접근성 켜기 (계단봇 선택)") {
                      startActivity(
                          Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                      )
                  }

                  btn("3. 시작 (화면 캡처 허용)") {
                      val mpm =
                          getSystemService(MediaProjectionManager::class.java)
                      startActivityForResult(
                          mpm.createScreenCaptureIntent(), 1
                      )
                  }

                  btn("종료") {
                      stopService(Intent(this, CaptureService::class.java))
                  }

                  setContentView(l)
              }

              override fun onActivityResult(
                  rq: Int,
                  rc: Int,
                  d: Intent?
              ) {
                  super.onActivityResult(rq, rc, d)

                  if (rq == 1 && rc == RESULT_OK && d != null) {
                      startForegroundService(
                          Intent(this, CaptureService::class.java)
                              .putExtra("rc", rc)
                              .putExtra("d", d)
                      )
                      moveTaskToBack(true)
                  }
              }
          }

          class CaptureService : Service() {
              @Volatile var run = false
              @Volatile var active = false
              @Volatile var firstTurn = false
              @Volatile var fr = Fr(false, 0, emptyList(), 0L, 0)

              @Volatile var tv: TextView? = null

              val ui = Handler(Looper.getMainLooper())

              var mp: MediaProjection? = null
              var reader: ImageReader? = null
              var ht: HandlerThread? = null
              var wm: WindowManager? = null
              var ov: View? = null

              var W = 0
              var H = 0

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(
                  i: Intent?,
                  f: Int,
                  id: Int
              ): Int {
                  val nm = getSystemService(NotificationManager::class.java)

                  nm.createNotificationChannel(
                      NotificationChannel(
                          "c",
                          "bot",
                          NotificationManager.IMPORTANCE_LOW
                      )
                  )

                  val n = Notification.Builder(this, "c")
                      .setContentTitle("계단봇 실행 중")
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .build()

                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(
                          1,
                          n,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
                      )
                  } else {
                      startForeground(1, n)
                  }

                  if (i == null || run) return START_NOT_STICKY

                  val rc = i.getIntExtra("rc", 0)
                  val d = i.getParcelableExtra<Intent>("d")
                      ?: return START_NOT_STICKY

                  wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  val pt = Point()
                  wm!!.defaultDisplay.getRealSize(pt)

                  W = pt.x
                  H = pt.y

                  mp = getSystemService(
                      MediaProjectionManager::class.java
                  ).getMediaProjection(rc, d)

                  mp!!.registerCallback(
                      object : MediaProjection.Callback() {},
                      Handler(Looper.getMainLooper())
                  )

                  reader = ImageReader.newInstance(
                      W,
                      H,
                      PixelFormat.RGBA_8888,
                      3
                  )

                  ht = HandlerThread("ir").also { it.start() }

                  reader!!.setOnImageAvailableListener(
                      { r -> onFrame(r) },
                      Handler(ht!!.looper)
                  )

                  mp!!.createVirtualDisplay(
                      "c",
                      W,
                      H,
                      resources.displayMetrics.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      reader!!.surface,
                      null,
                      null
                  )

                  showOverlay()

                  run = true

                  Thread { loop() }.start()

                  return START_NOT_STICKY
              }

              fun showOverlay() {
                  val l = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      alpha = 0.5f
                      setBackgroundColor(Color.BLACK)
                  }

                  val b1 = Button(this).apply {
                      text = "▶ 시작"
                      textSize = 12f
                  }

                  val b2 = Button(this).apply {
                      text = "첫칸:오르기"
                      textSize = 12f
                  }

                  val t = TextView(this).apply {
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      setPadding(12, 0, 12, 0)
                      text = "대기"
                  }

                  b1.setOnClickListener {
                      active = !active
                      b1.text = if (active) "■ 정지" else "▶ 시작"
                  }

                  b2.setOnClickListener {
                      firstTurn = !firstTurn
                      b2.text = if (firstTurn) "첫칸:전환" else "첫칸:오르기"
                  }

                  l.addView(b1)
                  l.addView(b2)
                  l.addView(t)

                  tv = t

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                  }

                  wm!!.addView(l, lp)
                  ov = l
              }

              // 새 프레임이 올 때마다 화면 분석
              fun onFrame(r: ImageReader) {
                  val img = try {
                      r.acquireLatestImage()
                  } catch (e: Exception) {
                      null
                  } ?: return

                  try {
                      val pl = img.planes[0]

                      val a = analyze(
                          pl.buffer,
                          pl.rowStride,
                          pl.pixelStride
                      )

                      val o = fr
                      val now = SystemClock.uptimeMillis()

                      fr = if (a == null) {
                          Fr(false, 0, emptyList(), now, 0)
                      } else {
                          Fr(
                              true,
                              a.first,
                              a.second,
                              now,
                              if (
                                  o.ok &&
                                  o.face == a.first &&
                                  o.dirs == a.second
                              ) o.stable + 1 else 0
                          )
                      }
                  } catch (e: Exception) {
                  } finally {
                      img.close()
                  }
              }

              // 발판 인식
              fun analyze(
                  buf: ByteBuffer,
                  rs: Int,
                  ps: Int
              ): Pair<Int, List<Int>>? {
                  val fx = W / 1080f
                  val fy = H / 2340f

                  val t0 = TPL[0]
                  val t1 = TPL[1]
                  val t2 = TPL[2]

                  // RGB 색상 특징
                  fun isRed(r: Int, g: Int, b: Int): Boolean {
                      return r > 65 &&
                          r > g * 1.25f &&
                          r > b * 1.20f
                  }

                  fun isYellow(r: Int, g: Int, b: Int): Boolean {
                      return r > 140 &&
                          g > 105 &&
                          b < 130 &&
                          r > b * 1.20f
                  }

                  fun isSkin(r: Int, g: Int, b: Int): Boolean {
                      return r > 120 &&
                          g > 70 &&
                          b > 40 &&
                          r > g * 1.15f &&
                          g > b * 1.10f
                  }

                  // 템플릿 자체에 해당 색상이 존재하는지 확인
                  fun expectedColor(
                      t: IntArray,
                      q: Int,
                      type: Int
                  ): Boolean {
                      val r = t[q]
                      val g = t[q + 1]
                      val b = t[q + 2]

                      return when (type) {
                          0 -> isRed(r, g, b)
                          1 -> isYellow(r, g, b)
                          else -> isSkin(r, g, b)
                      }
                  }

                  // 발판 일치 점수
                  fun score(cx: Int, cy: Int): Float {
                      var n = 0
                      var m0 = 0
                      var m1 = 0
                      var m2 = 0

                      var i = 0
                      var dy = -32

                      while (dy <= 32) {
                          var dx = -72

                          while (dx <= 72) {
                              val x = ((cx + dx) * fx).toInt()
                              val y = ((cy + dy) * fy).toInt()

                              if (x in 0 until W && y in 0 until H) {
                                  val o = y * rs + x * ps

                                  val r = buf.get(o).toInt() and 255
                                  val g = buf.get(o + 1).toInt() and 255
                                  val b = buf.get(o + 2).toInt() and 255

                                  val q = i * 3

                                  // 세 템플릿 중 하나라도 해당 색상을
                                  // 정상적으로 가지고 있으면 제외하지 않음
                                  val redOverlay =
                                      isRed(r, g, b) &&
                                      !expectedColor(t0, q, 0) &&
                                      !expectedColor(t1, q, 0) &&
                                      !expectedColor(t2, q, 0)

                                  val yellowOverlay =
                                      isYellow(r, g, b) &&
                                      !expectedColor(t0, q, 1) &&
                                      !expectedColor(t1, q, 1) &&
                                      !expectedColor(t2, q, 1)

                                  val skinOverlay =
                                      isSkin(r, g, b) &&
                                      !expectedColor(t0, q, 2) &&
                                      !expectedColor(t1, q, 2) &&
                                      !expectedColor(t2, q, 2)

                                  // 캐릭터, 코인, 사망 표시 등으로
                                  // 가려진 것으로 추정되는 픽셀 제외
                                  if (
                                      !redOverlay &&
                                      !yellowOverlay &&
                                      !skinOverlay
                                  ) {
                                      val d0 =
                                          abs(r - t0[q]) +
                                          abs(g - t0[q + 1]) +
                                          abs(b - t0[q + 2])

                                      val d1 =
                                          abs(r - t1[q]) +
                                          abs(g - t1[q + 1]) +
                                          abs(b - t1[q + 2])

                                      val d2 =
                                          abs(r - t2[q]) +
                                          abs(g - t2[q + 1]) +
                                          abs(b - t2[q + 2])

                                      if (d0 < 85) m0++
                                      if (d1 < 85) m1++
                                      if (d2 < 85) m2++

                                      n++
                                  }
                              }

                              i++
                              dx += 8
                          }

                          dy += 8
                      }

                      // 비교할 픽셀이 너무 적으면 판단 보류
                      if (n < 35) return -1f

                      return maxOf(
                          m0,
                          maxOf(m1, m2)
                      ).toFloat() / n
                  }

                  // 화면 움직임에 따른 위치 오차 보정
                  var ox = 0
                  var oy = 0

                  val s1 = maxOf(
                      score(375, 1408),
                      score(705, 1408)
                  )

                  if (s1 < MF) {
                      var best = s1
                      var by = -24

                      while (by <= 24) {
                          var bx = -36

                          while (bx <= 36) {
                              val v = maxOf(
                                  score(375 + bx, 1408 + by),
                                  score(705 + bx, 1408 + by)
                              )

                              if (v > best) {
                                  best = v
                                  ox = bx
                                  oy = by
                              }

                              bx += 6
                          }

                          by += 6
                      }

                      if (best < 0.6f) {
                          ox = 0
                          oy = 0
                      }
                  }

                  // 현재 바라보는 방향 확인
                  val sa = score(375 + ox, 1588 + oy)
                  val sb = score(705 + ox, 1588 + oy)

                  val face = when {
                      sa >= MF && sb < MF -> 1
                      sb >= MF && sa < MF -> -1
                      else -> 0
                  }

                  val dirs = ArrayList<Int>()
                  var col = 0

                  for (k in 1..10) {
                      val cy = 1498 - 90 * k + oy

                      val a = score(
                          540 + 165 * (col - 1) + ox,
                          cy
                      )

                      val b = score(
                          540 + 165 * (col + 1) + ox,
                          cy
                      )

                      val aa = maxOf(a, 0f)
                      val bb = maxOf(b, 0f)

                      val d = when {
                          aa >= SOFT &&
                              aa - bb >= MARGIN -> -1

                          bb >= SOFT &&
                              bb - aa >= MARGIN -> 1

                          a < 0f &&
                              b >= 0f &&
                              b <= CLEAR -> -1

                          b < 0f &&
                              a >= 0f &&
                              a <= CLEAR -> 1

                          k <= 6 &&
                              col - 1 == 0 &&
                              b >= 0f &&
                              b <= CLEAR -> -1

                          k <= 6 &&
                              col + 1 == 0 &&
                              a >= 0f &&
                              a <= CLEAR -> 1

                          else -> 0
                      }

                      if (d == 0) break

                      dirs.add(d)
                      col += d
                  }

                  return if (dirs.isEmpty()) {
                      null
                  } else {
                      Pair(face, dirs)
                  }
              }

              // 계획을 세우고 연속 터치
              fun loop() {
                  val fx = W / 1080f
                  val fy = H / 2340f

                  val P = ArrayList<Int>()
                  val tapT = ArrayList<Long>()

                  var issued = 0
                  var face = 0
                  var usedT = 0L
                  var lastTap = 0L
                  var badSince = 0L
                  var lastUi = 0L
                  var was = false

                  fun idxAt(t: Long): Int {
                      var c = issued

                      while (c > 0 && tapT[c - 1] > t) {
                          c--
                      }

                      return c
                  }

                  while (run) {
                      try {
                          if (!active) {
                              was = false
                              Thread.sleep(80)
                              continue
                          }

                          val now = SystemClock.uptimeMillis()

                          if (!was) {
                              was = true

                              P.clear()
                              tapT.clear()

                              issued = 0
                              face = 0
                              usedT = 0L
                              lastTap = 0L
                              badSince = 0L
                          }

                          val f = fr
                          val rest0 = P.size - issued

                          if (now - lastUi > 300) {
                              lastUi = now

                              val st =
                                  (if (f.ok) "인식O" else "인식X") +
                                  " 남은" + rest0

                              ui.post {
                                  tv?.text = st
                              }
                          }

                          if (!f.ok) {
                              if (badSince == 0L) {
                                  badSince = now
                              }

                              if (
                                  rest0 == 0 &&
                                  now - badSince > 800
                              ) {
                                  P.clear()
                                  tapT.clear()
                                  issued = 0
                                  face = 0
                              }
                          } else {
                              badSince = 0L

                              if (f.t != usedT) {
                                  if (rest0 > 0) {
                                      // 진행 중인 계획과 실제 화면 비교
                                      val ap = idxAt(f.t - LS)

                                      var tail: List<Int>? = null

                                      for (
                                          sh in intArrayOf(
                                              0, -1, 1, -2, 2, -3, 3
                                          )
                                      ) {
                                          val a = ap + sh
                                          val off = issued - a

                                          if (
                                              a < 0 ||
                                              a > issued ||
                                              off >= f.dirs.size
                                          ) continue

                                          if (
                                              a >= 1 &&
                                              f.face != 0 &&
                                              P[a - 1] != f.face
                                          ) continue

                                          val rest =
                                              f.dirs.subList(
                                                  off,
                                                  f.dirs.size
                                              )

                                          val m = minOf(
                                              rest.size,
                                              rest0
                                          )

                                          if (
                                              m >= 3 &&
                                              rest.subList(0, m) ==
                                              P.subList(
                                                  issued,
                                                  issued + m
                                              )
                                          ) {
                                              val tl = rest.subList(
                                                  minOf(
                                                      rest0,
                                                      rest.size
                                                  ),
                                                  rest.size
                                              )

                                              val t0 = tail

                                              if (t0 == null) {
                                                  tail = tl
                                              } else {
                                                  var i = 0

                                                  while (
                                                      i < t0.size &&
                                                      i < tl.size &&
                                                      t0[i] == tl[i]
                                                  ) {
                                                      i++
                                                  }

                                                  tail = t0.subList(0, i)
                                              }
                                          }
                                      }

                                      val tt = tail

                                      if (
                                          tt != null &&
                                          tt.isNotEmpty()
                                      ) {
                                          P.addAll(tt)
                                      }

                                      usedT = f.t
                                  } else if (
                                      (
                                          f.t > lastTap + LAT ||
                                          now - lastTap > 350
                                      ) &&
                                      (
                                          f.stable >= 2 ||
                                          now - f.t > 60
                                      )
                                  ) {
                                      // 화면이 멈춘 뒤 새 계획 생성
                                      usedT = f.t
                                      P.addAll(f.dirs)

                                      if (f.face != 0) {
                                          face = f.face
                                      }
                                  }
                              }
                          }

                          if (issued < P.size) {
                              val d = P[issued]

                              val turn =
                                  if (face == 0) {
                                      firstTurn
                                  } else {
                                      d != face
                                  }

                              val ts = TapService.inst

                              if (turn) {
                                  ts?.tap(
                                      185f * fx,
                                      1950f * fy
                                  )

                                  if (!TURN_CLIMBS) {
                                      Thread.sleep(GAP)

                                      ts?.tap(
                                          895f * fx,
                                          1950f * fy
                                      )
                                  }
                              } else {
                                  ts?.tap(
                                      895f * fx,
                                      1950f * fy
                                  )
                              }

                              face = d
                              issued++

                              lastTap = SystemClock.uptimeMillis()
                              tapT.add(lastTap)

                              Thread.sleep(GAP)
                          } else {
                              Thread.sleep(3)
                          }

                      } catch (e: Exception) {
                          Thread.sleep(30)
                      }
                  }
              }

              override fun onDestroy() {
                  run = false

                  try {
                      wm?.removeView(ov)
                  } catch (e: Exception) {}

                  try {
                      mp?.stop()
                  } catch (e: Exception) {}

                  try {
                      reader?.close()
                  } catch (e: Exception) {}

                  try {
                      ht?.quitSafely()
                  } catch (e: Exception) {}

                  super.onDestroy()
              }
          }
          E7

